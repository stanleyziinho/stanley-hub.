<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stanley Music</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#173c35,#07131c 65%);color:#fff;font:16px Arial,sans-serif}main{max-width:1500px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}a,button,input{font:inherit}a,button{color:white;text-decoration:none;background:#183c40;border:1px solid #4a7776;border-radius:12px;padding:12px;cursor:pointer}h1,h2,p{margin:8px 0}.hero{min-height:150px;padding:24px;border-radius:20px;background:linear-gradient(90deg,#061710e8,#06171033),url('https://stanleyziinho.github.io/-futebol-livre/assets/images/Music.png') center/cover;border:1px solid #547b70;display:flex;flex-direction:column;justify-content:center}.hero p{color:#c6e9d6}form{display:flex;gap:10px;margin:20px 0}input{min-width:0;flex:1;padding:13px;background:#10252b;border:1px solid #547b70;border-radius:12px;color:white}form button{background:#b91d32}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin:16px 0 24px}.card{display:block;padding:0;overflow:hidden;background:#112a30;border-radius:16px;transition:transform .18s,box-shadow .18s}.cover{display:block;position:relative;aspect-ratio:2/3;background:linear-gradient(135deg,#205c48,#101e30);overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover;display:block}.cover span{position:absolute;right:10px;bottom:10px;background:#071c18df;border-radius:50%;padding:10px}.card strong{display:block;padding:12px;text-align:center}.platforms{display:flex;gap:12px;flex-wrap:wrap}.spotify{background:#14783b}.youtube{background:#a91c2d}:focus{outline:3px solid #8fffd0;outline-offset:3px}.card:focus,.card:hover{transform:translateY(-5px) scale(1.025);box-shadow:0 0 22px #46e8a477;z-index:2}.note{color:#a7c5c2;font-size:13px;margin-top:20px}@media(min-width:1000px){.grid{grid-template-columns:repeat(8,minmax(0,1fr));gap:12px}}@media(max-width:600px){main{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{min-height:130px}header h2{font-size:18px}}
</style></head><body><main><header><h2>STANLEY MUSIC</h2><a href="./">&#8592; Voltar ao HUB</a></header><section class="hero"><h1>Stanley Music</h1><p>M&#250;sicas, artistas, clipes e playlists</p></section><form id="search"><input id="q" type="search" placeholder="Buscar m&#250;sica ou artista" required><button type="submit">Pesquisar</button></form><h2>Estilos musicais</h2><section class="grid" id="cards"></section><h2>Plataformas</h2><div class="platforms"><a class="youtube" href="https://music.youtube.com/">YouTube Music</a><a class="spotify" href="https://open.spotify.com/">Spotify</a></div><p class="note">Reprodu&#231;&#227;o nos servi&#231;os oficiais. STANLEY MUSIC V1.1</p></main><script>
(function(){var base='https://stanleyziinho.github.io/-futebol-livre/assets/images/';var data=[['Sertanejo','sertanejo-hits.png','sertanejo'],['Funk','love-funk.png','funk brasileiro'],['Pagode','pagode.png','pagode'],['Gospel','musica-gospel.png','gospel brasileiro'],['Rap e Trap','Trap .png','rap trap brasileiro'],['Pop','pop.png','pop'],['Rock','rock.png','rock'],['Eletr\u00f4nica','eletronica.png','m\u00fasica eletr\u00f4nica']];function yt(q){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q)}var grid=document.getElementById('cards');data.forEach(function(d){var a=document.createElement('a');a.className='card';a.href=yt(d[2]+' clipes oficiais '+new Date().getFullYear());var cover=document.createElement('div');cover.className='cover';var img=document.createElement('img');img.alt=d[0];img.src=base+encodeURIComponent(d[1]);img.onerror=function(){img.style.display='none'};cover.appendChild(img);var play=document.createElement('span');play.textContent='\u25b6';cover.appendChild(play);a.appendChild(cover);var label=document.createElement('strong');label.textContent=d[0];a.appendChild(label);grid.appendChild(a)});document.getElementById('search').onsubmit=function(e){e.preventDefault();location.href=yt(document.getElementById('q').value.trim())};document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT')return;var dirs={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};var d=dirs[e.key];if(!d)return;var els=Array.prototype.slice.call(document.querySelectorAll('a,button,input'));var cur=document.activeElement;if(els.indexOf(cur)<0){els[0].focus();e.preventDefault();return}var r=cur.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,best=null,score=Infinity;els.forEach(function(el){if(el===cur)return;var b=el.getBoundingClientRect(),dx=b.left+b.width/2-x,dy=b.top+b.height/2-y,forward=dx*d[0]+dy*d[1],side=Math.abs(dx*d[1]+dy*d[0]);if(forward>5&&forward+side*3<score){score=forward+side*3;best=el}});if(best){e.preventDefault();best.focus()}})})();
</script></body></html>
