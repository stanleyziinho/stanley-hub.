<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061331">
<title>STANLEY HUB V3.3</title>
<style>
:root{--bg:#061331;--fg:#fff;--muted:#b9c6e4;--neon:#87c4ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--fg);background:var(--bg)}
body{background:radial-gradient(ellipse at 50% -25%,#1d60b3 0%,transparent 65%),linear-gradient(135deg,#06122b,#10163a 60%,#080f26);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(145deg,transparent 18%,#0e48a633 19%,transparent 25%,transparent 83%,#1a52b122 85%,transparent 91%);pointer-events:none}
.shell{max-width:1570px;margin:auto;padding:clamp(15px,2.4vw,36px);position:relative}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:clamp(24px,4vw,55px)}
.brand{display:flex;align-items:center;gap:16px;min-width:0}.mark{height:65px;width:65px;flex:0 0 65px;display:grid;place-items:center;background:linear-gradient(135deg,#207efb,#682add);border-radius:20px;box-shadow:0 8px 25px #060b27;font-weight:900;font-size:36px}
h1{margin:0;font-size:clamp(25px,3.2vw,45px);letter-spacing:.5px;white-space:nowrap}.blue{color:#58b1ff}.subtitle{color:#b5c7e9;font-size:clamp(10px,1.2vw,16px);letter-spacing:3px;margin-top:5px}
.status{display:flex;align-items:center;gap:15px;font-size:15px;white-space:nowrap}.clock{font-size:clamp(22px,2.2vw,35px);font-weight:800}.connection{color:#d3ddf4}.dot{display:inline-block;width:12px;height:12px;background:#48eba7;border-radius:50%;margin-right:7px}.offline .dot{background:#ffb74d}
.main-grid,.bottom-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.7vw,24px)}
.main-grid{margin-bottom:clamp(18px,3vw,45px)}
.tile{appearance:none;border:2px solid #ffffff33;text-align:left;color:#fff;cursor:pointer;border-radius:25px;position:relative;overflow:hidden;isolation:isolate;min-width:0;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;outline:none;touch-action:manipulation}
.tile:focus-visible,.tile.focused,.tile:hover{transform:translateY(-11px) scale(1.035);border-color:#fff;box-shadow:0 0 0 3px #4aaaff,0 0 28px #419cfa9a,0 22px 40px #0009;z-index:5}
.hero{height:clamp(175px,25vw,360px);background:#10214a;padding:0}.hero img{width:100%;height:100%;display:block;object-fit:fill}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 80%,#04132d25);pointer-events:none}
.mini{height:clamp(106px,13vw,175px);padding:clamp(12px,1.7vw,23px);display:flex;align-items:center;gap:16px}
.mini .symbol{font-size:clamp(29px,3vw,52px);font-weight:900;flex:0 0 auto;width:1.5em;text-align:center}.mini strong{display:block;font-size:clamp(15px,2vw,27px);margin-bottom:7px}.mini small{display:block;color:#ebefff;font-size:clamp(11px,1.1vw,16px);line-height:1.35}
.apps{background:linear-gradient(130deg,#04a954,#005e58)}.settings{background:linear-gradient(130deg,#892ce7,#321077)}.games{background:linear-gradient(130deg,#ffad00,#bf4800)}
footer{display:flex;justify-content:space-between;gap:12px;color:#bac5dc;font-size:13px;margin-top:26px}
.dialog-back{position:fixed;inset:0;z-index:40;background:#020817d9;display:none;align-items:center;justify-content:center;padding:16px}.dialog-back.open{display:flex}
.dialog{width:min(520px,100%);background:#101e41;border:1px solid #4678cc;border-radius:20px;padding:22px;box-shadow:0 20px 80px #000c;max-height:90vh;overflow:auto}.dialog h2{margin:0 0 12px}.dialog p{color:#c9d7f2;line-height:1.4}.dialog label{display:block;font-size:13px;margin:16px 0 5px}.dialog input{width:100%;background:#07142d;color:#fff;border:1px solid #4d6190;border-radius:9px;padding:12px;font-size:15px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.action{padding:11px 17px;border:0;border-radius:10px;background:#2b4680;color:#fff;font-size:15px;cursor:pointer}.action.primary{background:#227af0}.action:focus-visible{outline:3px solid #fff}
@media(max-width:680px){.shell{padding:14px}header{margin:8px 0 24px}.mark{width:46px;height:46px;flex-basis:46px;border-radius:13px;font-size:27px}.brand{gap:9px}.subtitle{font-size:8px;letter-spacing:1px}.status{gap:6px}.connection{font-size:10px}.clock{font-size:17px}.main-grid{gap:10px}.bottom-grid{gap:10px}.hero{height:clamp(110px,33vw,185px);border-radius:13px}.mini{height:96px;border-radius:13px;padding:9px;display:block}.mini .symbol{font-size:24px;width:auto;text-align:left}.mini strong{font-size:12px;margin:4px 0}.mini small{font-size:10px}.tile:focus-visible,.tile.focused,.tile:hover{transform:translateY(-5px) scale(1.02)}footer{font-size:10px}}
@media(max-width:390px){.main-grid,.bottom-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.hero{height:105px}.mini{height:100px}.mini small{font-size:9px}h1{font-size:21px}}
@media(prefers-reduced-motion:reduce){.tile{transition:none}}

.shell{height:100vh;min-height:0;display:flex;flex-direction:column;padding:clamp(10px,2vw,28px)}header{margin:0 0 18px;flex-shrink:0}.mark{width:48px;height:48px;flex-basis:48px;font-size:28px;border-radius:14px}main{flex:1;min-height:0;display:flex;align-items:center}.main-grid{width:100%;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1.4vw,20px);margin:0}.hero{height:clamp(100px,48vh,340px);border-radius:18px}.hero img{object-fit:contain;background:#0a1835}.gear{background:#203a70;padding:7px 12px;font-size:22px;border-radius:12px}.music{background:radial-gradient(ellipse at top,#167d83,#103253 55%,#081a32);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px}.music-art{font-size:clamp(40px,12vh,100px);color:#70ffcf;text-shadow:0 0 22px #16dca5}.music strong{font-size:clamp(13px,2vw,27px)}.music small{font-size:clamp(10px,1.2vw,16px);margin-top:8px;color:#c8eee8}footer{margin-top:12px;flex-shrink:0}@media(max-width:680px) and (orientation:portrait){.shell{height:auto;min-height:100vh}.main-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{height:150px}main{display:block}.status{gap:5px}.gear{padding:4px 8px}.subtitle{letter-spacing:0}}

/* V3.3: dark ambient wallpaper and edge-to-edge artwork */
body{background:#090b12;background-image:radial-gradient(ellipse at 14% 18%,#53213d66,transparent 43%),radial-gradient(ellipse at 85% 75%,#145c5666,transparent 48%),linear-gradient(125deg,#080910,#17141f 52%,#080f14)}
body:before{background:repeating-linear-gradient(125deg,transparent 0,transparent 85px,#ffffff06 86px,transparent 88px),linear-gradient(125deg,transparent 22%,#b84e7a22 23%,transparent 29%,transparent 70%,#35cbb622 72%,transparent 78%)}
.shell{padding:clamp(16px,2.6vw,36px)}
.main-grid{gap:clamp(12px,1.6vw,24px)}
.hero{height:auto;aspect-ratio:1.29;max-height:52vh;padding:0;display:block;background:#10131e;border-radius:18px}
.hero img{display:block;width:100%;height:100%;object-fit:fill;background:transparent}
.tile:focus-visible,.tile.focused{transform:translateY(-7px) scale(1.035);border-color:#fff;box-shadow:0 0 0 2px #80d9ff,0 0 22px #60c5ff77,0 12px 25px #0009}
@media(max-width:680px) and (orientation:portrait){.hero{height:auto;max-height:none;aspect-ratio:1.29}.main-grid{gap:12px}}
</style>
</head>

<script>
(function(){'use strict';
var defaults={sports:'https://stanleyziinho.github.io/-futebol-livre/',tv:'https://stanleyziinho.github.io/-futebol-livre/stanley-tv-hibrida-teste.html',retro:'https://stanleyziinho.github.io/stanley-play/retro-home-v6-teste.html'};

var backdrop=document.getElementById('backdrop'),dialogContent=document.getElementById('dialogContent'),title=document.getElementById('dialogTitle'),saveBtn=document.getElementById('saveBtn');

function closeDialog(){backdrop.classList.remove('open');backdrop.setAttribute('aria-hidden','true');if(lastCard&&lastCard.focus)lastCard.focus()}

function act(k){if(k==='music'){window.location.href='stanley-music.html';return}if(k==='sports'||k==='tv'||k==='retro'){launch(k);return}
if(k==='settings'){var keys=['sports','tv','retro'],labels=['Stanley Sports','Stanley TV','Stanley Retr\u00F4'];var html='<p>Altere os endere\u00E7os se os aplicativos forem publicados em outras p\u00E1ginas.</p>';keys.forEach(function(x,i){html+='<label for="url_'+x+'">'+labels[i]+'</label><input id="url_'+x+'" type="url" spellcheck="false">'});showDialog('Configura\u00E7\u00F5es',html,true);keys.forEach(function(x){document.getElementById('url_'+x).value=urls[x]||defaults[x]});return}
if(k==='apps'){showDialog('Aplicativos','<p>Selecione um dos tr\u00EAs cards superiores para abrir Stanley Sports, Stanley TV ou Stanley Retr\u00F4.</p>',false);return}
showDialog('Jogos instalados','<p>A execu\u00E7\u00E3o de jogos locais ser\u00E1 adicionada quando criarmos o APK Android. Por enquanto, use o Stanley Retr\u00F4 para os jogos online.</p>',false)}
cards.forEach(function(c){c.addEventListener('click',function(){act(c.getAttribute('data-app'))});c.addEventListener('mouseenter',function(){cards.forEach(function(x){x.classList.remove('focused')});c.classList.add('focused')});c.addEventListener('focus',function(){cards.forEach(function(x){x.classList.remove('focused')});c.classList.add('focused')})});

document.addEventListener('keydown',function(e){
if(backdrop.classList.contains('open')){if(e.key==='Escape'||e.key==='Backspace'&&e.target.tagName!=='INPUT'){e.preventDefault();closeDialog()}return}
var keys=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];if(keys.indexOf(e.key)<0){if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault()}return}
var current=document.activeElement;if(cards.indexOf(current)<0)return;var main=cards.filter(function(c){return c.classList.contains('hero')});var i=main.indexOf(current);if(e.key==='ArrowDown' && i>=0)return; // Android pode mover foco para a barra nativa
if(e.key==='ArrowUp' && i>=0){e.preventDefault();focusCard(document.querySelector('.gear'));return}if(i<0){if(e.key==='ArrowDown'){e.preventDefault();focusCard(main[0])}return}e.preventDefault();focusCard(main[(i+(e.key==='ArrowLeft'?main.length-1:1))%main.length]);});
focusCard(document.querySelector(".hero"));
})();
</script>
</body>
</html>
