name: STANLEY HUB - Gerar APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Criar projeto Android
        shell: bash
        run: |
          mkdir -p app/src/main/java/br/com/stanleyhub app/src/main
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'StanleyHub'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'br.com.stanleyhub'
            compileSdk 35
            defaultConfig {
              applicationId 'br.com.stanleyhub'
              minSdk 23
              targetSdk 32
              versionCode 1
              versionName '1.0'
            }
            buildTypes {
              release { minifyEnabled false }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-feature android:name="android.software.leanback" android:required="false" />
            <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
            <application android:label="STANLEY HUB" android:theme="@android:style/Theme.Material.NoActionBar" android:usesCleartextTraffic="false" android:hardwareAccelerated="true">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape" android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize|uiMode">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.HOME" />
                  <category android:name="android.intent.category.DEFAULT" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/br/com/stanleyhub/MainActivity.java <<'EOF'
          package br.com.stanleyhub;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.graphics.Color;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.net.Uri;
          import android.widget.FrameLayout;

          public class MainActivity extends Activity {
              private static final String HUB = "https://stanleyziinho.github.io/stanley-hub./";
              private static final String TV_ANTIGA = "https://stanleyziinho.github.io/-futebol-livre/stanley-tv.html";
              private static final String TV_HIBRIDA = "https://stanleyziinho.github.io/-futebol-livre/stanley-tv-hibrida-teste.html";
              private WebView browser;
              private FrameLayout frame;
              private View fullScreen;
              private WebChromeClient.CustomViewCallback fullScreenCallback;

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().getDecorView().setSystemUiVisibility(5894 | 1024 | 512);
                  frame = new FrameLayout(this);
                  frame.setBackgroundColor(Color.rgb(5, 14, 32));
                  browser = new WebView(this);
                  browser.setBackgroundColor(Color.rgb(5, 14, 32));
                  browser.setFocusable(true);
                  browser.setFocusableInTouchMode(true);
                  browser.getSettings().setJavaScriptEnabled(true);
                  browser.getSettings().setDomStorageEnabled(true);
                  browser.getSettings().setMediaPlaybackRequiresUserGesture(false);
                  browser.getSettings().setCacheMode(WebSettings.LOAD_DEFAULT);
                  browser.getSettings().setAllowFileAccess(false);
                  browser.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          if (!request.isForMainFrame()) return false;
                          String url = request.getUrl().toString();
                          if (url.startsWith(TV_ANTIGA)) { view.loadUrl(TV_HIBRIDA); return true; }
                          if (url.startsWith("https://stanleyziinho.github.io/")) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); } catch (Exception ignored) { }
                          return true;
                      }
                  });
                  browser.setWebChromeClient(new WebChromeClient() {
                      @Override public void onShowCustomView(View view, CustomViewCallback cb) {
                          if (fullScreen != null) { cb.onCustomViewHidden(); return; }
                          fullScreen=view;
                          fullScreenCallback=cb;
                          frame.addView(view, new FrameLayout.LayoutParams(-1,-1));
                          browser.setVisibility(View.GONE);
                      }
                      @Override public void onHideCustomView() { closeFullScreen(); }
                  });
                  frame.addView(browser, new FrameLayout.LayoutParams(-1,-1));
                  setContentView(frame);
                  browser.loadUrl(HUB);
                  browser.requestFocus();
              }
              private void closeFullScreen() {
                  if (fullScreen==null) return;
                  frame.removeView(fullScreen);
                  fullScreen=null;
                  browser.setVisibility(View.VISIBLE);
                  if (fullScreenCallback!=null) fullScreenCallback.onCustomViewHidden();
                  fullScreenCallback=null;
              }
              @Override public void onBackPressed() {
                  if (fullScreen!=null) { closeFullScreen(); return; }
                  if (browser!=null && !browser.getUrl().equals(HUB)) { browser.loadUrl(HUB); return; }
                  super.onBackPressed();
              }
              @Override protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  if (browser!=null) browser.loadUrl(HUB);
              }
              @Override protected void onDestroy() {
                  if (browser!=null) { frame.removeView(browser); browser.destroy(); browser=null; }
                  super.onDestroy();
              }
          }
          EOF
      - name: Compilar APK debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Disponibilizar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: STANLEY-HUB-APK-V1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
